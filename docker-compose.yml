x-service: &service
  restart: unless-stopped
  environment: &env
    KAFKA_BROKERS: kafka:9092
    DB_PATH: /app/data/service.db

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      AUTH_ADDR: auth_service:50051
      WAREHOUSE_ADDR: warehouse_service:50052
      ORDER_ADDR: order_service:50053
      SALES_ADDR: sales_service:50054
    depends_on:
      - auth_service
      - warehouse_service
      - order_service
      - sales_service

  auth_service:
    <<: *service
    build: ./auth_service
    environment:
      <<: *env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - auth_data:/app/data

  warehouse_service:
    <<: *service
    build: ./warehouse_service
    volumes:
      - warehouse_data:/app/data

  order_service:
    <<: *service
    build: ./order_service
    environment:
      <<: *env
      AUTH_ADDR: auth_service:50051
      WAREHOUSE_ADDR: warehouse_service:50052
    volumes:
      - order_data:/app/data

  sales_service:
    <<: *service
    build: ./sales_service
    environment:
      <<: *env
      WAREHOUSE_ADDR: warehouse_service:50052
    volumes:
      - sales_data:/app/data

  notification_service:
    <<: *service
    build: ./notification_service
    volumes:
      - notification_data:/app/data
    depends_on:
      - kafka

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  auth_data:
  warehouse_data:
  order_data:
  sales_data:
  notification_data:
