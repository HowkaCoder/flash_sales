name: tidy

on:
  pull_request:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: |
          for d in auth_service gateway notification_service order_service sales_service warehouse_service; do
            (cd $d && go mod tidy)
          done
      - run: |
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -am "go mod tidy"
            git push
          fi
